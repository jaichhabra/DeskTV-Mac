appId: io.desktv.mac
productName: DeskTV
copyright: Copyright © 2026 JC
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.entertainment
  # No Apple Developer ID yet: build/afterPack.cjs signs each app ad hoc instead, which Apple Silicon needs to run it.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: DeskTV-${version}-${arch}.${ext}
dmg:
  title: DeskTV ${version}
afterPack: build/afterPack.cjs
npmRebuild: false
