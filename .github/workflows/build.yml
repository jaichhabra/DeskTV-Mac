name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --mac --publish never

      # Start the built app (Apple Silicon) for a while and check that it runs, finds the Mac's apps and logs no errors.
      - name: Smoke test
        run: |
          APP="dist/mac-arm64/DeskTV.app"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/DeskTV" --windowed &
          PID=$!
          sleep 25
          kill -0 $PID
          # A picture of the home screen, as it runs on this Mac.
          screencapture -x dist/mac-home.png || true
          LOG="$HOME/Library/Application Support/DeskTV/logs/desktv.log"
          cat "$LOG"
          grep -q "starting" "$LOG"
          grep -q "Found [0-9]* installed apps" "$LOG"
          ! grep -q " ERROR " "$LOG"
          kill $PID

      - uses: actions/upload-artifact@v4
        with:
          name: DeskTV-mac
          path: |
            dist/DeskTV-*.dmg
            dist/DeskTV-*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeskTV-mac-screenshot
          path: dist/mac-home.png
          if-no-files-found: ignore
